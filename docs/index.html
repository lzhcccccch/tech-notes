<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tech Notes：记录后端、前端、AI 与工程实践的个人技术博客。"
    />
    <meta name="theme-color" content="#477552" />
    <title>Tech Notes</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23477552'/%3E%3Cpath d='M16 18h32v7H36v23h-8V25H16z' fill='white'/%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="主导航">
      <a class="site-brand" href="#/" aria-label="Tech Notes 首页">
        <span class="site-brand__mark" aria-hidden="true">T</span>
        <span>Tech Notes</span>
      </a>
      <nav class="site-nav" aria-label="站点链接">
        <div class="site-nav__pages">
          <a class="site-nav__link" href="#/">首页</a>
          <a class="site-nav__link" href="#/about">关于</a>
        </div>
        <a
          class="site-nav__github"
          href="https://github.com/lzhcccccch/tech-notes"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="在 GitHub 上查看 Tech Notes"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.3-5.27-1.29-5.27-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.16 1.18a10.96 10.96 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.77.11 3.06.74.81 1.19 1.84 1.19 3.1 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.18c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
          </svg>
        </a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色模式">
          <span aria-hidden="true">◐</span>
          <span class="theme-toggle__text">深色</span>
        </button>
      </nav>
    </header>

    <div id="app" class="app-loading">正在整理笔记…</div>

    <script>
      window.BLOG_CONFIG = {
        repository: 'lzhcccccch/tech-notes',
        branch: 'main',
        comments: {
          repoId: '',
          category: 'Announcements',
          categoryId: ''
        }
      };

      window.$docsify = {
        name: 'Tech Notes',
        nameLink: '#/',
        // GitHub 入口已放入固定页头，关闭会与页头重叠的 Docsify 角标。
        repo: '',
        homepage: 'README.md',
        loadSidebar: true,
        auto2top: true,
        // 全局侧栏只用于知识分类导航，文章内标题不再注入侧栏。
        // 否则长文章会产生大量二、三级目录，挤掉真正的站点导航。
        subMaxLevel: 0,
        maxLevel: 4,
        relativePath: true,
        notFoundPage: '404.md',
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: '搜索文章、标题或关键词',
          noData: '没有找到相关内容',
          depth: 4,
          hideOtherSidebarContent: false
        },
        pagination: {
          previousText: '上一篇',
          nextText: '下一篇',
          crossChapter: true,
          crossChapterText: true
        },
        copyCode: {
          buttonText: '复制',
          errorText: '复制失败',
          successText: '已复制'
        }
      };
    </script>
    <script src="assets/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  </body>
</html>
